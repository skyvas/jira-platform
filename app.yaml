# ==============================================================================
# Wasmer Edge Application & Build Configuration
# Schema: wasmer.io/App.v0
# ==============================================================================

kind: wasmer.io/App.v0
name: jira-platform
package: .
debug: false
force_https: true

# Environment variables injected into the running Wasmer instance
env:
  HOST: "0.0.0.0"
  PORT: "8000"
  PYTHONUNBUFFERED: "1"

# Execution arguments passed to the Python runtime
cli_args:
  - "main.py"

# Performance and cold-start optimization capabilities
capabilities:
  instaboot:
    enabled: true
    requests:
      - path: /health
      - path: /

# Edge proxy automated health checks
health_checks:
  - path: /health
    method: GET
    interval: 30
    timeout: 5
    healthy_threshold: 1
    unhealthy_threshold: 3
    expect:
      status_codes:
        - 200
